name: Keep Render backend awake

on:
  schedule:
    # Render's free tier sleeps after ~15 min of no traffic; ping every 14
    # minutes so it never gets the chance. GitHub's scheduler doesn't
    # guarantee exact timing (runs can lag a few minutes), so this is
    # best-effort, not a hard guarantee against cold starts.
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the health endpoint
        run: curl -sf https://ecocharge-j8fp.onrender.com/health
