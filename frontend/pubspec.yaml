name: ecocharge
description: Find, book, and charge your EV at nearby green charging stations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.1
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
